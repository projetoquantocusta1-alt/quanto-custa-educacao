name: Sondagem das fontes

on:
  push:
    paths: [sondar.py, .github/workflows/sondar.yml]
  workflow_dispatch:
    inputs:
      fontes:
        description: "Em branco para todas, ou: siconfi transparencia inep ipca siope"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python sondar.py ${{ github.event.inputs.fontes }}
      - uses: actions/upload-artifact@v4
        with:
          name: sondagem
          path: dados_brutos/sondagem/*.json
